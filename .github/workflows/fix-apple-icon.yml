name: Fix Apple Home Screen icon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create real 180x180 PNG icon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          src = Image.open("logo-coctelix.png").convert("RGB")
          w, h = src.size
          side = min(w, h)
          left = (w - side) // 2
          top = (h - side) // 2
          src = src.crop((left, top, left + side, top + side))
          src = src.resize((180, 180), Image.Resampling.LANCZOS)
          src.save("apple-touch-icon.png", "PNG", optimize=True)
          print("Created", Image.open("apple-touch-icon.png").size)
          PY

      - name: Commit icon and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-apple-icon.yml
          git add apple-touch-icon.png .github/workflows/fix-apple-icon.yml
          git diff --cached --quiet && exit 0
          git commit -m "Use real 180x180 Apple home screen icon [skip ci]"
          git push
